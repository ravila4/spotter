[project]
name = "spotter"
version = "0.1.0"
description = "Conversation-driven workout storage"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
spotter = "spotter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
